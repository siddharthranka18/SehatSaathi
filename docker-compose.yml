services:

  qdrant:

    image: qdrant/qdrant:latest

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage


  backend:

    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      - QDRANT_HOST=qdrant

    depends_on:
      - qdrant

    volumes:
      - ./backend/data:/app/data

    restart: unless-stopped



  frontend:

    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    depends_on:
      - backend

    environment:
      - VITE_API_URL=http://backend:8000

    restart: unless-stopped



volumes:

  qdrant_data: